<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>कृषिधारा</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);
      min-height: 100vh;
      padding-bottom: 80px;
      color: #2d5016;
    }

     .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            position: relative;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-logo {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
            margin: 0;
        }

        .leaf-icon {
            width: 30px;
            height: 30px;
            fill: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .profile-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .profile-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .profile-btn svg {
            width: 24px;
            height: 24px;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }

        .location-info svg {
            width: 18px;
            height: 18px;
        }

        .location-text {
            font-size: 14px;
            font-weight: 500;
        }

    .weather-section {
      padding: 40px 30px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 25px;
      color: #2d5016;
      position: relative;
      padding-left: 10px;
    }

    /* Removed the red/green line from section title */
    .section-title::before {
      display: none;
    }

    .premium-card {
      background: linear-gradient(145deg, #ffffff, #f8f8f8);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 
        0 10px 30px rgba(76, 175, 80, 0.1),
        0 4px 15px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(76, 175, 80, 0.15);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .premium-card:hover {
      transform: translateY(-5px);
      box-shadow: 
        0 15px 35px rgba(76, 175, 80, 0.15),
        0 8px 20px rgba(0, 0, 0, 0.12);
    }

    /* Removed the colored line from top of card */
    .premium-card::before {
      display: none;
    }

    .premium-card h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #2d5016;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 15px;
      /* Removed the border line under the heading */
      border-bottom: none;
    }

    .premium-card h3 i {
      font-size: 22px;
      color: #4CAF50;
      background: rgba(76, 175, 80, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .premium-card p {
      font-size: 17px;
      line-height: 1.8;
      color: #2d5016;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
      padding: 12px 15px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.6);
      transition: all 0.3s ease;
    }

    .premium-card p:hover {
      background: rgba(76, 175, 80, 0.08);
      transform: translateX(5px);
    }

    .premium-card span {
      font-weight: 600;
      color: #2d6d42;
      min-width: 140px;
      display: inline-block;
    }

    .premium-card i {
      color: #4CAF50;
      font-size: 20px;
      width: 24px;
      text-align: center;
    }

    .detail-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: linear-gradient(135deg, #4CAF50, #2d6d42);
      color: white;
      text-align: center;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
      letter-spacing: 0.5px;
    }

    .detail-btn:hover {
      background: linear-gradient(135deg, #2d6d42, #4CAF50);
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
    }

    .detail-btn i {
      margin-right: 8px;
    }

    @media (max-width: 768px) {
      .header {
        padding: 20px;
        justify-content: flex-start; /* Changed to flex-start for mobile too */
      }
      
      .app-title-hindi {
        font-size: 28px;
      }
      
      .weather-section {
        padding: 30px 20px;
      }
      
      .premium-card {
        padding: 20px;
      }
      
      .premium-card p {
        font-size: 16px;
        gap: 10px;
      }
      
      .section-title {
        font-size: 20px;
      }
    }

    /* Dynamic data styling */
    .data-value {
      font-weight: 700;
      color: #2d6d42;
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    .status-good {
      background-color: #4CAF50;
    }

    .status-warning {
      background-color: #FFC107;
    }

    .status-alert {
      background-color: #F44336;
    }

     .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .nav-item.active {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .nav-item:hover {
            transform: translateY(-2px);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .floating-stats {
            position: fixed;
            top: 120px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .stats-item {
            text-align: center;
            margin-bottom: 8px;
        }

        .stats-number {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stats-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
  </style>
</head>
<body>

  <!-- Header with Hindi text on the left -->
  <header class="header">
    <div class="header-content">
        <div class="app-brand">
            <div class="app-logo">
                <svg class="leaf-icon" viewBox="0 0 24 24">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
                </svg>
            </div>
            <div class="app-title">
                कृषि धारा
            </div>
        </div>
        <div class="header-actions">
            <div class="location-info">
                <svg fill="white" viewBox="0 0 24 24">
                    <path d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"/>
                </svg>
                <span class="location-text">Ranchi, Jharkhand</span>
            </div>
            <div class="profile-btn" onclick="openProfile()">
                <svg fill="white" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
        </div>
    </div>
  </header>

  <div class="weather-section">

    <!-- Current Weather (only remaining section) -->
    <h2 class="section-title"><i class="fa fa-sun"></i> Current Weather</h2>
    <div class="premium-card">
      <h3><i class="fa fa-sun"></i> Weather Conditions</h3>
      <p><i class="fa fa-thermometer-half"></i> <span>Temperature:</span> <span class="data-value" id="temperature">28°C</span> <span class="status-indicator status-good" id="temp-status"></span></p>
      <p><i class="fa fa-tint"></i> <span>Humidity:</span> <span class="data-value" id="humidity">65%</span> <span class="status-indicator status-good" id="humidity-status"></span></p>
      <p><i class="fa fa-wind"></i> <span>Wind Speed:</span> <span class="data-value" id="wind-speed">12 km/h</span> <span class="status-indicator status-good" id="wind-status"></span></p>
      <p><i class="fa fa-cloud-rain"></i> <span>Rainfall:</span> <span class="data-value" id="rainfall">0 mm</span> <span class="status-indicator status-good" id="rain-status"></span></p>
    </div>

    <a href="#" class="detail-btn"><i class="fa fa-file-alt"></i> View Detailed Report</a>

  </div>

  <nav class="bottom-nav">
        <div class="nav-item " onclick="navigateTo('home')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item" onclick="navigateTo('ai-recommendations')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 1L9 9L1 12L9 15L12 23L15 15L23 12L15 9L12 1Z"/>
            </svg>
            <span class="nav-label">AI Tips</span>
        </div>
        <div class="nav-item" onclick="navigateTo('scan')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M12 4A8 8 0 0 1 20 12A8 8 0 0 1 12 20A8 8 0 0 1 4 12A8 8 0 0 1 12 4M12 6A6 6 0 0 0 6 12A6 6 0 0 0 12 18A6 6 0 0 0 18 12A6 6 0 0 0 12 6M12 8A4 4 0 0 1 16 12A4 4 0 0 1 12 16A4 4 0 0 1 8 12A4 4 0 0 1 12 8M11 10V14H13V10H11M10 15V17H14V15H10Z"/>
            </svg>
            <span class="nav-label">Scan</span>
        </div>
        <div class="nav-item active" onclick="navigateTo('weather')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6.5 20Q4.22 20 2.61 18.43Q1 16.85 1 14.58Q1 12.63 2.17 11.1Q3.35 9.57 5.25 9.15Q5.88 6.85 7.75 5.43Q9.63 4 12 4Q14.93 4 16.96 6.04Q19 8.07 19 11Q20.73 11.2 21.86 12.5Q23 13.78 23 15.5Q23 17.38 21.69 18.69Q20.38 20 18.5 20H6.5Z"/>
            </svg>
            <span class="nav-label">Weather</span>
        </div>
        <div class="nav-item" onclick="navigateTo('market')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M7 18C5.9 18 5 18.9 5 20S5.9 22 7 22 9 21.1 9 20 8.1 18 7 18M1 2V4H3L6.6 11.59L5.24 14.04C5.09 14.32 5 14.65 5 15C5 16.1 5.9 17 7 17H19V15H7.42C7.28 15 7.17 14.89 7.17 14.75L7.2 14.63L8.1 13H15.55C16.3 13 16.96 12.59 17.3 11.97L20.88 5H5.21L4.27 3H1M17 18C15.9 18 15 18.9 15 20S15.9 22 17 22 19 21.1 19 20 18.1 18 17 18Z"/>
            </svg>
            <span class="nav-label">Market</span>
        </div>
    </nav>

  <script>
    // Simulate dynamic data updates
    document.addEventListener('DOMContentLoaded', function() {
      // Function to generate random weather data
      function updateWeatherData() {
        // Temperature between 20-35°C
        const temp = (20 + Math.random() * 15).toFixed(1);
        document.getElementById('temperature').textContent = temp + '°C';
        
        // Update status based on temperature
        const tempStatus = document.getElementById('temp-status');
        if (temp < 25) {
          tempStatus.className = 'status-indicator status-good';
        } else if (temp < 30) {
          tempStatus.className = 'status-indicator status-warning';
        } else {
          tempStatus.className = 'status-indicator status-alert';
        }
        
        // Humidity between 40-90%
        const humidity = (40 + Math.random() * 50).toFixed(0);
        document.getElementById('humidity').textContent = humidity + '%';
        
        // Update humidity status
        const humidityStatus = document.getElementById('humidity-status');
        if (humidity < 60) {
          humidityStatus.className = 'status-indicator status-good';
        } else if (humidity < 80) {
          humidityStatus.className = 'status-indicator status-warning';
        } else {
          humidityStatus.className = 'status-indicator status-alert';
        }
        
        // Wind speed between 5-25 km/h
        const windSpeed = (5 + Math.random() * 20).toFixed(1);
        document.getElementById('wind-speed').textContent = windSpeed + ' km/h';
        
        // Update wind status
        const windStatus = document.getElementById('wind-status');
        if (windSpeed < 15) {
          windStatus.className = 'status-indicator status-good';
        } else if (windSpeed < 20) {
          windStatus.className = 'status-indicator status-warning';
        } else {
          windStatus.className = 'status-indicator status-alert';
        }
        
        // Rainfall - mostly 0, sometimes light rain
        const rainfall = Math.random() > 0.8 ? (Math.random() * 10).toFixed(1) : '0';
        document.getElementById('rainfall').textContent = rainfall + ' mm';
        
        // Update rain status
        const rainStatus = document.getElementById('rain-status');
        if (rainfall == '0') {
          rainStatus.className = 'status-indicator status-good';
        } else if (rainfall < 5) {
          rainStatus.className = 'status-indicator status-warning';
        } else {
          rainStatus.className = 'status-indicator status-alert';
        }
      }
      
      // Update data immediately on load
      updateWeatherData();
      
      // Update data every 10 seconds
      setInterval(updateWeatherData, 10000);
    });

    function navigateTo(page) {
        // Remove active class from all nav items
        document.querySelectorAll('.nav-item').forEach(item => {
            item.classList.remove('active');
        });

        // Add active class to clicked item
        event.currentTarget.classList.add('active');

        // Navigate to the appropriate page
        if (page === 'ai-recommendations') {
            window.location.href = 'ai-assistant.html'; // Redirect to AI Assistant page
        } else if (page === 'weather') {
            window.location.href = 'weather.html'; // Redirect to Weather page
        } else if (page === 'market') {
            window.location.href = 'market.html'; // Redirect to Market page
        } else if (page === 'scan') {
            window.location.href = 'scan.html'; // Redirect to Market page
        }
        else if (page === 'home') {
            window.location.href = 'home.html'; // Redirect to Market page
        }  else {
            alert(`Navigating to ${page} page`);
        }
    }
  </script>

</body>
</html>
