<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कृषि धारा - AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f8f0 0%, #e8f5e8 100%);
            min-height: 100vh;
            padding-bottom: 80px;
            color: #2d5016;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
            position: relative;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-logo {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.3);
            margin: 0;
        }

        .leaf-icon {
            width: 30px;
            height: 30px;
            fill: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .profile-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .profile-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.1);
        }

        .profile-btn svg {
            width: 24px;
            height: 24px;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
        }

        .location-info svg {
            width: 18px;
            height: 18px;
        }

        .location-text {
            font-size: 14px;
            font-weight: 500;
        }

        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .chat-messages {
            height: calc(100vh - 300px);
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .bot-avatar {
            background: #4CAF50;
            color: white;
        }

        .user-avatar {
            background: #2196F3;
            color: white;
        }

        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 15px;
            max-width: 70%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .message.user .message-content {
            background: #2196F3;
            color: white;
        }

        .input-container {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chat-input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .send-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .send-btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .suggestions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .suggestion-chip {
            background: #f0f8f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #4CAF50;
            color: #2d5016;
        }

        .suggestion-chip:hover {
            background: #4CAF50;
            color: white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .nav-item.active {
            color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
        }

        .nav-icon {
            width: 24px;
            height: 24px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <header class="header">
    <div class="header-content">
        <div class="app-brand">
            <div class="app-logo">
                <svg class="leaf-icon" viewBox="0 0 24 24">
                    <path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"/>
                </svg>
            </div>
            <div class="app-title">
                कृषि धारा
            </div>
        </div>
        <div class="header-actions">
            <div class="location-info">
                <svg fill="white" viewBox="0 0 24 24">
                    <path d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"/>
                </svg>
                <span class="location-text">Ranchi, Jharkhand</span>
            </div>
            <div class="profile-btn" onclick="openProfile()">
                <svg fill="white" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
        </div>
    </div>
</header>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message">
                <div class="message-avatar bot-avatar">🤖</div>
                <div class="message-content">
                    Hello! I'm your KrishiDhara AI Assistant. How can I help you with farming today?
                </div>
            </div>
        </div>

        <div class="input-container">
            <input type="text" class="chat-input" id="userInput" placeholder="Type your message here..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <div class="suggestions">
            <div class="suggestion-chip" onclick="usesuggestion('What crops are suitable for this season?')">What crops are suitable for this season?</div>
            <div class="suggestion-chip" onclick="usesuggestion('How to control pests in rice?')">How to control pests in rice?</div>
            <div class="suggestion-chip" onclick="usesuggestion('Best fertilizers for wheat?')">Best fertilizers for wheat?</div>
            <div class="suggestion-chip" onclick="usesuggestion('Weather forecast')">Weather forecast</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="navigateTo('home')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
            <span class="nav-label">Home</span>
        </div>
        <div class="nav-item active" onclick="navigateTo('ai-recommendations')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 1L9 9L1 12L9 15L12 23L15 15L23 12L15 9L12 1Z"/>
            </svg>
            <span class="nav-label">AI Tips</span>
        </div>
        <div class="nav-item" onclick="navigateTo('scan')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2A10 10 0 0 0 2 12A10 10 0 0 0 12 22A10 10 0 0 0 22 12A10 10 0 0 0 12 2M12 4A8 8 0 0 1 20 12A8 8 0 0 1 12 20A8 8 0 0 1 4 12A8 8 0 0 1 12 4M12 6A6 6 0 0 0 6 12A6 6 0 0 0 12 18A6 6 0 0 0 18 12A6 6 0 0 0 12 6M12 8A4 4 0 0 1 16 12A4 4 0 0 1 12 16A4 4 0 0 1 8 12A4 4 0 0 1 12 8M11 10V14H13V10H11M10 15V17H14V15H10Z"/>
            </svg>
            <span class="nav-label">Scan</span>
        </div>
        <div class="nav-item" onclick="navigateTo('weather')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M6.5 20Q4.22 20 2.61 18.43Q1 16.85 1 14.58Q1 12.63 2.17 11.1Q3.35 9.57 5.25 9.15Q5.88 6.85 7.75 5.43Q9.63 4 12 4Q14.93 4 16.96 6.04Q19 8.07 19 11Q20.73 11.2 21.86 12.5Q23 13.78 23 15.5Q23 17.38 21.69 18.69Q20.38 20 18.5 20H6.5Z"/>
            </svg>
            <span class="nav-label">Weather</span>
        </div>
        <div class="nav-item" onclick="navigateTo('market')">
            <svg class="nav-icon" fill="currentColor" viewBox="0 0 24 24">
                <path d="M7 18C5.9 18 5 18.9 5 20S5.9 22 7 22 9 21.1 9 20 8.1 18 7 18M1 2V4H3L6.6 11.59L5.24 14.04C5.09 14.32 5 14.65 5 15C5 16.1 5.9 17 7 17H19V15H7.42C7.28 15 7.17 14.89 7.17 14.75L7.2 14.63L8.1 13H15.55C16.3 13 16.96 12.59 17.3 11.97L20.88 5H5.21L4.27 3H1M17 18C15.9 18 15 18.9 15 20S15.9 22 17 22 19 21.1 19 20 18.1 18 17 18Z"/>
            </svg>
            <span class="nav-label">Market</span>
        </div>
    </nav>

    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (message) {
                addMessage(message, 'user');
                generateResponse(message);
                input.value = '';
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function addMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${sender}-avatar`;
            avatar.textContent = sender === 'user' ? '👤' : '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            chatMessages.appendChild(messageDiv);
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function generateResponse(userMessage) {
            // Simulate thinking
            setTimeout(() => {
                const responses = {
                    'weather': 'Based on current forecasts, the weather will be suitable for farming with moderate temperatures and a chance of rain in the coming days.',
                    'crops': 'For this season, I recommend considering wheat, mustard, or potato cultivation based on your location.',
                    'pests': 'For pest control, I recommend using neem-based organic pesticides and maintaining proper field hygiene.',
                    'fertilizer': 'For optimal results, use a balanced NPK fertilizer (14-14-14) along with organic compost.',
                    'default': 'I understand your question about farming. Could you please provide more specific details so I can help you better?'
                };

                let response = responses.default;
                
                if (userMessage.toLowerCase().includes('weather')) {
                    response = responses.weather;
                } else if (userMessage.toLowerCase().includes('crop')) {
                    response = responses.crops;
                } else if (userMessage.toLowerCase().includes('pest')) {
                    response = responses.pests;
                } else if (userMessage.toLowerCase().includes('fertilizer')) {
                    response = responses.fertilizer;
                }

                addMessage(response, 'bot');
            }, 1000);
        }

        function usesuggestion(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function navigateTo(page) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            
            event.currentTarget.classList.add('active');
            
            if (page === 'ai-recommendations') {
                window.location.href = 'ai-assistant.html';
            } else if (page === 'weather') {
                window.location.href = 'weather.html';
            } else if (page === 'market') {
                window.location.href = 'market.html';
            } else if (page === 'scan') {
                window.location.href = 'scan.html';
            } else if (page === 'home') {
                window.location.href = 'home.html';
            }
        }
    </script>
</body>
</html>
